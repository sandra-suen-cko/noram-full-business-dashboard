version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noram-backend
    ports:
      - "8000:8000"
    environment:
      - SPREADSHEET_ID=1FCK4lgiQPuHvxc8KxIoxQsSucI-rPySVjovW2MXGjDA
      - GOOGLE_CREDENTIALS_PATH=secrets/credentials.json
      - GOOGLE_TOKEN_PATH=secrets/token.json
      - CACHE_TTL_MINUTES=5
      - DEBUG=False
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: noram-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
